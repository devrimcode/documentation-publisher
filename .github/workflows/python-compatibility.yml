name: Python compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip check

      - name: Compile source and tests
        run: python -m compileall -q publisher_engine tests scripts

      - name: Core regression
        run: >-
          python -m pytest -q
          --ignore=tests/test_process.py
          --ignore=tests/test_packaging.py
          --ignore=tests/test_p6_p7_manifest_cleanup.py

      - name: Manifest and cleanup integration regression
        run: python -m pytest -q tests/test_p6_p7_manifest_cleanup.py

      - name: Wheel installation regression
        run: python -m pytest -q tests/test_packaging.py

      - name: Process and timeout regression
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: python -m pytest -q tests/test_process.py
